spring:
  application:
    name: banking-api-gateway

  cloud:
    gateway:
      routes:

        # Account Service Routing
        - id: account-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/accounts/**
          filters:
            - StripPrefix=1

        # Transaction Service Routing
        - id: transaction-service
          uri: http://localhost:9090
          predicates:
            - Path=/api/transactions/**
          filters:
            - StripPrefix=1

server:
  port: 9091